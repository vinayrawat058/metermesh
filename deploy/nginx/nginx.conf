# Round-robins client traffic across live MeterMesh nodes.
# Ownership still decides which node totals a customer; this only picks the
# first hop. Dead upstreams are skipped after a failed connection.

upstream metermesh_nodes {
    least_conn;
    server node1:8080 max_fails=1 fail_timeout=5s;
    server node2:8080 max_fails=1 fail_timeout=5s;
    server node3:8080 max_fails=1 fail_timeout=5s;
}

server {
    listen 80;
    server_name _;

    location /health {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_pass http://metermesh_nodes;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    location /v1/metrics/stream {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 24h;
        proxy_pass http://metermesh_nodes;
        proxy_next_upstream off;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_pass http://metermesh_nodes;
    }
}

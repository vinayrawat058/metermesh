name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Publish image and GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build release binaries
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o dist/metermesh-linux-amd64 ./cmd/server
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o dist/metermesh-darwin-amd64 ./cmd/server
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-s -w" -o dist/metermesh-darwin-arm64 ./cmd/server
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o dist/metermesh-windows-amd64.exe ./cmd/server

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract tag
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/metermesh:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/metermesh:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.tag }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/metermesh-linux-amd64
            dist/metermesh-darwin-amd64
            dist/metermesh-darwin-arm64
            dist/metermesh-windows-amd64.exe
          body: |
            ## MeterMesh ${{ steps.meta.outputs.tag }}

            ### Docker
            ```bash
            docker pull ghcr.io/${{ github.repository_owner }}/metermesh:${{ steps.meta.outputs.tag }}
            ```

            ### Quick cluster
            ```bash
            git clone https://github.com/${{ github.repository }}.git
            cd metermesh
            docker compose up --build
            ```

            Dashboard: http://localhost:3000
            Ingest: http://localhost:8080/v1/usage

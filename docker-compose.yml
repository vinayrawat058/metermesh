# Local cluster: three MeterMesh nodes, PostgreSQL, and Redis.
# Each customer is totaled on one node. That node flushes the sums to Postgres.

x-node-env: &node-env
  LISTEN_ADDR: ":8080"
  POSTGRES_URL: postgres://metermesh:metermesh@postgres:5432/metermesh?sslmode=disable
  REDIS_URL: redis://redis:6379/0
  FLUSH_INTERVAL: 5s

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: metermesh
      POSTGRES_PASSWORD: metermesh
      POSTGRES_DB: metermesh
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metermesh -d metermesh"]
      interval: 2s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 20

  node1:
    build: .
    environment:
      <<: *node-env
      NODE_ID: node1
      ADVERTISE_URL: http://node1:8080
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  node2:
    build: .
    environment:
      <<: *node-env
      NODE_ID: node2
      ADVERTISE_URL: http://node2:8080
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  node3:
    build: .
    environment:
      <<: *node-env
      NODE_ID: node3
      ADVERTISE_URL: http://node3:8080
    ports:
      - "8083:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  dashboard:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - node1
      - node2
      - node3

# Local cluster: three MeterMesh nodes, PostgreSQL, and Redis.
# Service wiring is filled in when the node process reads its environment.

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: metermesh
      POSTGRES_PASSWORD: metermesh
      POSTGRES_DB: metermesh
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  node1:
    build: .
    environment:
      NODE_ID: node1
    ports:
      - "8081:8080"
    depends_on:
      - postgres
      - redis

  node2:
    build: .
    environment:
      NODE_ID: node2
    ports:
      - "8082:8080"
    depends_on:
      - postgres
      - redis

  node3:
    build: .
    environment:
      NODE_ID: node3
    ports:
      - "8083:8080"
    depends_on:
      - postgres
      - redis

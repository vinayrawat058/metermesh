# Local cluster: three MeterMesh nodes, PostgreSQL, and Redis.
# Nodes total usage in memory and flush those sums to Postgres.

x-node-env: &node-env
  LISTEN_ADDR: ":8080"
  POSTGRES_URL: postgres://metermesh:metermesh@postgres:5432/metermesh?sslmode=disable
  REDIS_URL: redis://redis:6379/0
  FLUSH_INTERVAL: 5s

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: metermesh
      POSTGRES_PASSWORD: metermesh
      POSTGRES_DB: metermesh
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metermesh -d metermesh"]
      interval: 2s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  node1:
    build: .
    environment:
      <<: *node-env
      NODE_ID: node1
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  node2:
    build: .
    environment:
      <<: *node-env
      NODE_ID: node2
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  node3:
    build: .
    environment:
      <<: *node-env
      NODE_ID: node3
    ports:
      - "8083:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
